services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
      - frontend
    volumes:
      - ./infrastructure/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8085:80"        # single entrypoint: http://localhost:8085

  # Persistence for users / sessions / API clients / tokens. The API only uses
  # it when DATABASE_URL is set in .env — leave it unset for a pure in-memory run.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    # Uncomment to reach it from the host (e.g. for `sqlx` / a GUI):
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared rate-limiter state. The API only uses it when REDIS_URL is set;
  # compose points it here by default.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector store for the RAG index (/api/rag/*). The API only connects to it
  # when LLM_API_KEY is set — an unreachable Qdrant at that point fails the
  # API's startup, since it's core to the RAG feature rather than optional.
  qdrant:
    image: qdrant/qdrant:v1.18.2
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6333"        # REST + dashboard
      - "6334"        # gRPC (what the API uses)
    # Uncomment to browse the dashboard at http://localhost:6333/dashboard:
    # ports:
    #   - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6334' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    # Only watch the Rust sources — not frontend/, uploads/, etc.
    command: cargo watch -w src -w Cargo.toml -w Cargo.lock -x run
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    expose:
      - "8000"
    # Uncomment to also reach the API directly, bypassing nginx:
    # ports:
    #   - "8000:8000"
    env_file: .env
    environment:
      RUST_LOG: ${RUST_LOG:-rag_api=info,tower_http=info}
      # Point the app at the bundled Postgres / Redis / Qdrant unless .env overrides them.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6334}

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/frontend/Dockerfile.dev
    command: sh -c "pnpm install && pnpm run dev -- --host"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    expose:
      - "5173"
    # Uncomment to also reach vite directly, bypassing nginx:
    # ports:
    #   - "5173:5173"
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-RAG API}
      VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8085}

volumes:
  cargo-cache:
  target-cache:
  frontend_modules:
  postgres-data:
  qdrant-data:
