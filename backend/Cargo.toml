[package]
name = "rag-api"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum       = { version = "0.7", features = ["multipart", "macros"] }
tokio      = { version = "1",   features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"

uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

anyhow    = "1"
thiserror = "2"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy    = "0.15"
async-trait = "0.1"
clap       = { version = "4", features = ["derive"] }

dashmap  = "6"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "macros",
    "migrate",
] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }

# Vector store for the RAG index.
qdrant-client = "1"

utoipa        = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

argon2 = "0.5"
rand   = "0.8"
sha2   = "0.10"
base64 = "0.22"

# PDF text extraction feeding ingestion.
lopdf = "0.45"

# Best-effort PII redaction at ingest time (opt-in).
regex = "1"

[dev-dependencies]
tower           = { version = "0.5", features = ["util"] }
http-body-util  = "0.1"
tokio           = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json      = "1"
tempfile        = "3"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true

[lints.clippy]
dbg_macro   = "warn"
todo        = "warn"
unwrap_used = "warn"
