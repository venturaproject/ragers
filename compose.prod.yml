# Production topology: postgres + redis + api + nginx. nginx is the only thing
# exposed; Postgres, Redis and the Rust API sit on the internal network only.
#
#   docker compose -f compose.prod.yml up -d --build
#
# Separate project name so prod images/containers never collide with the dev
# stack (which shares service names).
name: boilerplate-rust-api-prod

services:
  # Bundled Postgres. Point the app at an external managed instance instead by
  # setting DATABASE_URL in .env — this service is then unused (skip it with
  # `docker compose -f compose.prod.yml up -d --scale postgres=0`).
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}   # ← override in .env
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"          # internal only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Shared rate-limiter state across API replicas. Unused if REDIS_URL is unset.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"          # internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Vector store for the RAG index (/api/rag/*). Unused if LLM_API_KEY is
  # unset; an unreachable Qdrant at that point fails the API's startup.
  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    expose:
      - "6334"          # internal only — gRPC, what the API uses
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6334' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      RUST_LOG: ${RUST_LOG:-rag_api=info,tower_http=info}
      PORT: 8000
      # Use the bundled Postgres / Redis / Qdrant unless .env sets external URLs.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@postgres:5432/${POSTGRES_DB:-rag}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6334}
      # Behind the nginx proxy: trust its forwarded headers, mark cookies Secure,
      # emit HSTS. Lock CORS to your real origin(s) in .env.
      TRUST_PROXY: "true"
      SESSION_COOKIE_SECURE: "true"
      # CORS_ALLOWED_ORIGINS=https://rag.example.com
    expose:
      - "8000"          # internal only — no `ports:` mapping
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    build:
      context: .
      dockerfile: infrastructure/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    # The image ships a self-signed cert so HTTPS works immediately.
    # Mount a real cert to replace it:
    # volumes:
    #   - ./infrastructure/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres-data:
  qdrant-data:
