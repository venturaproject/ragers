# ─────────────────────────────────────────────────────────────────────────────
# DEV edge: single entrypoint in front of the hot-reload stack.
#   /        -> vite dev server (frontend:5173), with HMR websocket
#   /api,/health -> rust api (api:8000, cargo watch)
# Mounted read-only into the stock nginx image (no build needed).
# ─────────────────────────────────────────────────────────────────────────────

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Docker internal DNS — resolves service names lazily at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100m;

    # ---- API -> rust ----------------------------------------------------
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /health (liveness) and /health/ready (readiness)
    location /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        access_log off;
    }

    # ---- everything else -> vite (with HMR websocket) -----------------
    location / {
        set $fe_upstream http://frontend:5173;
        proxy_pass $fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
    }
}
