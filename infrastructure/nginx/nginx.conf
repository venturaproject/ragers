# ─────────────────────────────────────────────────────────────────────────────
# Edge config: serves the built SPA and reverse-proxies /api to the Rust binary.
# Dropped into /etc/nginx/conf.d/default.conf (included inside the stock http{}).
#
# TLS: this file terminates HTTPS. Mount a cert/key at
# infrastructure/nginx/certs/{fullchain,privkey}.pem (see compose.prod.yml) and
# run on 443. If TLS is terminated upstream (cloud LB), delete the 443 server
# and the redirect, keep the :80 server, and set TRUST_PROXY=true in .env.
# ─────────────────────────────────────────────────────────────────────────────

# General API request-rate budget + a much stricter one for auth endpoints.
limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=authz:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=apiconn:10m;

upstream api {
    server api:8000;
    keepalive 16;
}

# ---- HTTP → HTTPS redirect (comment out if TLS is terminated upstream) ------
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    # For an upstream-terminated setup, change these two lines to `listen 80;`
    # and drop the ssl_* directives + the redirect server above.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- hardening ------------------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    client_max_body_size 100m;      # keep in sync with MAX_FILE_SIZE_MB
    client_body_timeout  60s;
    client_header_timeout 15s;
    send_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- static SPA --------------------------------------------------------
    root /srv/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- auth endpoints: strict throttle (brute-force / credential stuffing)
    location ~ ^/api/(v1/auth|ext/auth)/ {
        limit_req  zone=authz burst=5 nodelay;
        limit_conn apiconn 10;
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- API --------------------------------------------------------------
    location /api/ {
        limit_req  zone=api burst=20 nodelay;
        limit_conn apiconn 10;

        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;   # shield the backend from slow uploads
        proxy_connect_timeout 5s;
        proxy_send_timeout   300s;    # large files / batch parsing can be slow
        proxy_read_timeout   300s;
    }

    # /health (liveness) and /health/ready (readiness)
    location /health {
        proxy_pass http://api;
        access_log off;
    }
}
